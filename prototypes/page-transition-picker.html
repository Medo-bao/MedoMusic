<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedoMusic 页面切换动效原型</title>
  <style>
    :root { --accent:#35c6d0; --ease-out:cubic-bezier(.23,1,.32,1); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:#f7f8f8; background:#111416; font:14px/1.45 "Segoe UI","Microsoft YaHei UI",sans-serif; overflow:hidden; }
    button { font:inherit; }
    #stage { min-height:100vh; }
    .demo { display:grid; grid-template-columns:230px 1fr; min-height:100vh; }
    .sidebar { padding:54px 14px; background:#191d1f; border-right:1px solid rgba(255,255,255,.09); }
    .brand { margin:0 12px 28px; font-size:18px; }
    .nav { width:100%; display:block; padding:13px 16px; border:0; border-radius:6px; color:#a8afb1; background:transparent; text-align:left; cursor:pointer; }
    .nav.active { color:white; background:rgba(53,198,208,.14); box-shadow:inset 3px 0 var(--accent); }
    .main { padding:68px 52px; }
    .surface h1 { margin:0 0 36px; font-size:36px; font-weight:350; }
    .toolbar { display:flex; gap:24px; padding-bottom:15px; border-bottom:1px solid rgba(255,255,255,.1); color:#a8afb1; }
    .toolbar strong { color:white; border-bottom:3px solid var(--accent); padding-bottom:13px; }
    .rows { display:grid; gap:3px; padding-top:16px; }
    .row { display:grid; grid-template-columns:50px 1fr; align-items:center; gap:13px; padding:8px; border-radius:7px; }
    .row:nth-child(odd) { background:rgba(255,255,255,.04); }
    .art { width:46px; height:46px; border-radius:5px; background:linear-gradient(135deg,#27666b,#283033); }
    .copy { display:grid; gap:4px; }
    .copy small { color:#a8afb1; }
    .variant-note { position:fixed; top:20px; right:22px; color:#a8afb1; font-size:12px; }
    .quiet-enter { animation:quiet 100ms var(--ease-out); }
    .spatial-enter { animation:spatial 180ms var(--ease-out); }
    .layered-enter h1,.layered-enter .toolbar { animation:layer 170ms var(--ease-out) both; }
    .layered-enter .rows { animation:layer 210ms var(--ease-out) 35ms both; }
    @keyframes quiet { from { opacity:.78; } }
    @keyframes spatial { from { opacity:.72; transform:translateY(5px); } }
    @keyframes layer { from { opacity:.68; transform:translateY(6px); } }
    @media (prefers-reduced-motion:reduce) {
      .quiet-enter,.spatial-enter,.layered-enter h1,.layered-enter .toolbar,.layered-enter .rows {
        animation-name:quiet; animation-duration:80ms; transform:none;
      }
    }
    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }
    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }
    .proto-picker-item {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }
    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
    .proto-picker-item[data-active] { color: #fff; }
    .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
    .proto-picker-replay { padding: 0 10px; font-size: 14px; }
    .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">安静</button>
    <button class="proto-picker-item">空间</button>
    <button class="proto-picker-item">分层</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>
  <script>
    function demo(motionClass, note) {
      return `<div class="demo"><aside class="sidebar"><div class="brand">◉ MedoMusic</div>
        <button class="nav active">我的音乐</button><button class="nav">最近播放</button>
        <button class="nav">正在播放</button><button class="nav">设置</button></aside>
        <main class="main"><div class="surface ${motionClass}"><h1>我的音乐</h1>
        <div class="toolbar"><strong>歌曲</strong><span>艺术家</span><span>专辑</span></div>
        <div class="rows">${["夜航","青色时刻","日落之前","城市漫游","月光"].map((title,i)=>
          `<div class="row"><span class="art"></span><span class="copy"><b>${title}</b><small>示例艺术家 · 示例专辑 ${i+1}</small></span></div>`).join("")}</div>
        </div></main><span class="variant-note">${note}</span></div>`;
    }
    const variants = [
      () => demo("quiet-enter","100ms · 仅透明度"),
      () => demo("spatial-enter","180ms · 整体轻位移"),
      () => demo("layered-enter","170–210ms · 标题与内容分层")
    ];
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;
    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }
    function mount(i) {
      stage.innerHTML = '';
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }
    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }
    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);
    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });
    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
